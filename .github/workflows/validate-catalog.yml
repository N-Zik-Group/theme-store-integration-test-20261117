name: Validate catalog
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always execute trusted base code, including on fork pull requests.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: node --test .github/scripts/test_validate_submission.cjs
      - run: node --test .github/scripts/test_moderation_workflow.cjs
      - run: node --test .github/scripts/roadmap.test.mjs
      - name: Validate pull request catalog data with trusted code
        if: github.event_name == 'pull_request_target'
        run: python -I -B .github/scripts/validate_pr_catalog.py
      - name: Validate published catalog
        if: github.event_name != 'pull_request_target'
        run: python .github/scripts/validate_catalog.py
